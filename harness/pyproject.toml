[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lantern-harness"
version = "0.1.0"
description = "A domain-agnostic execution harness for AI agents: crash-resume, typed contracts, tracing, governance, and dynamic routing for any agent you already built."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Pranav Deshmukh" },
]
keywords = [
    "agents",
    "ai-agents",
    "orchestration",
    "llm",
    "workflow",
    "observability",
    "governance",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["pydantic>=2,<3", "pyyaml>=6,<7", "openai>=1,<3"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6,<1", "build>=1", "twine>=5"]

[project.urls]
Homepage = "https://github.com/pranav-deshmukh/lantern"
Repository = "https://github.com/pranav-deshmukh/lantern"
Issues = "https://github.com/pranav-deshmukh/lantern/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["harness*"]

[tool.setuptools.package-data]
harness = ["py.typed"]
