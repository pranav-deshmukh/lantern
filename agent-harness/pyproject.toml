[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "harness"
version = "0.1.0"
description = "A minimal multi-step execution engine"
requires-python = ">=3.10"
dependencies = ["pydantic>=2,<3", "pyyaml>=6,<7", "openai>=1,<3"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
