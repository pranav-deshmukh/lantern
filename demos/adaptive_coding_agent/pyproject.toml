[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-coding-agent-demo"
version = "0.1.0"
description = "Adaptive coding agent init-flow demo built on the harness package"
requires-python = ">=3.10"
dependencies = [
    "harness @ file:../../harness",
    "ruff>=0.6,<1",
]

[tool.setuptools]
py-modules = ["steps", "run_init"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
